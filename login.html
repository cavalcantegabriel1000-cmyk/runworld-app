<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050807"><title>Entrar — RunWorld</title><link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="pagina-auth"><main class="auth-card"><a class="auth-marca" href="index.html">R <span>RunWorld</span></a><h1>Bem-vindo de volta</h1><p>Entre para continuar sua jornada.</p><form id="formLogin"><label>E-mail<input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"></label><label>Senha<input id="senha" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><button class="botao-principal" type="submit">Entrar</button><p id="mensagem" class="auth-msg"></p></form><p class="auth-link">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p><a class="auth-link" href="index.html">Continuar em modo demonstração</a></main><style>.pagina-auth{overflow:auto;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#172b1d,#050807 70%)}.auth-card{width:min(430px,100%);background:#101812;border:1px solid #2b3930;border-radius:25px;padding:28px;box-shadow:var(--sombra)}.auth-marca{color:var(--verde);font-weight:900;text-decoration:none;font-size:24px}.auth-marca span{color:#fff}.auth-card h1{margin:32px 0 8px}.auth-card>p,.auth-msg{color:var(--suave);font-size:13px}.auth-card label{display:grid;gap:7px;margin:17px 0;font-size:12px;color:var(--suave)}.auth-card input{padding:13px;border-radius:12px;border:1px solid var(--borda);background:#080d09;color:#fff}.auth-card .botao-principal{margin-top:22px}.auth-link{display:block;text-align:center;font-size:12px;color:var(--suave);margin-top:20px}.auth-link a{color:var(--verde)}.auth-msg{line-height:1.5}</style><script>document.getElementById('formLogin').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('mensagem');if(!window.supabaseClient){msg.textContent='Configure as credenciais do Supabase em config.js.';return;}msg.textContent='Entrando…';const {error}=await window.supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('senha').value});if(error){msg.textContent=error.message;return;}location.href='index.html';});</script></body></html>
