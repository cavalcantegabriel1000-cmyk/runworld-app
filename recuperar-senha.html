<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050807"><title>Recuperar senha • RunWorld</title>
  <link rel="stylesheet" href="./login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card">
      <img src="./runworld-logo.svg" alt="RunWorld" style="display:block;width:76px;height:76px;object-fit:contain;margin:0 auto 20px">
      <h1>Recuperar senha</h1><p>Informe seu e-mail para receber as instruções de recuperação.</p>
      <form id="formRecuperacao">
        <label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
        <button type="submit" id="enviar">Enviar instruções</button>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
      <p><a href="./login.html">Voltar para entrar</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('formRecuperacao');
    const mensagem = document.getElementById('mensagem');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const client = window.supabaseClient;
      if (!client) { mensagem.textContent = 'Não foi possível conectar ao Supabase. Confira config.js.'; return; }
      const email = document.getElementById('email').value.trim();
      const botao = document.getElementById('enviar'); botao.disabled = true; mensagem.textContent = 'Enviando...';
      try {
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: new URL('./redefinir-senha.html', window.location.href).href });
        if (error) throw error;
        mensagem.textContent = 'Se esse e-mail estiver cadastrado, você receberá as instruções de recuperação. Confira também o spam.';
      } catch (err) { mensagem.textContent = err.message || 'Não foi possível enviar o e-mail.'; }
      finally { botao.disabled = false; }
    });
  </script>
</body>
</html>
