
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050807">
    <title>RunWorld • Carregando</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./config.js"></script>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #050807;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .entrada {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 22px;
            padding: 24px;
            isolation: isolate;
        }

        .video-fundo {
            position: absolute;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .28;
        }

        .fundo-escuro {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle, #10221bd9, #050807 72%);
        }

        .marca {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: surgir .8s ease both;
        }

        .logo {
            width: 112px;
            height: 112px;
            object-fit: cover;
            border-radius: 28px;
            border: 1px solid #00e67680;
            box-shadow: 0 0 50px #00e67630;
        }

        .nome {
            margin: 0;
            font-size: clamp(30px, 8vw, 42px);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .frase {
            margin: 8px 0 0;
            color: #00e676;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-align: center;
        }

        .carregamento {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d4ded8;
            font-size: 13px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff30;
            border-top-color: #00e676;
            border-radius: 50%;
            animation: girar .8s linear infinite;
        }

        .mensagem {
            max-width: 300px;
            min-height: 18px;
            margin: 0;
            color: #aab8b0;
            font-size: 12px;
            text-align: center;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }

        @keyframes surgir {
            from { opacity: 0; transform: translateY(12px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main class="entrada">
        <video class="video-fundo" autoplay muted playsinline preload="auto" aria-hidden="true">
            <source src="./logo_animacao.mp4" type="video/mp4">
        </video>

        <div class="fundo-escuro"></div>

        <div class="marca">
            <img class="logo"
                 src="./IMG-20260923-WA4190.jpg"
                 alt="Logo RunWorld">
            <div>
                <h1 class="nome">RunWorld</h1>
                <p class="frase">EXPLORE. CORRA. CONQUISTE.</p>
            </div>
        </div>

        <div class="carregamento">
            <span class="spinner" aria-hidden="true"></span>
            <span id="estado">Preparando sua jornada...</span>
        </div>

        <p class="mensagem" id="detalhe" role="status" aria-live="polite">
            Estamos preparando o RunWorld.
        </p>
    </main>

    <script>
    (() => {
        "use strict";

        const TEMPO_MINIMO = 2200;
        const TEMPO_MAXIMO = 12000;
        const inicio = Date.now();

        let redirecionando = false;

        const estado = document.getElementById("estado");
        const detalhe = document.getElementById("detalhe");
        const video = document.querySelector(".video-fundo");

        function esperar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function obterSessao() {
            const supabase = window.supabaseClient;

            if (!supabase || !supabase.auth) {
                return null;
            }

            // O SDK pode precisar de um instante para processar
            // o retorno da autenticação OAuth.
            for (let tentativa = 0; tentativa < 8; tentativa++) {
                try {
                    const resultado = await supabase.auth.getSession();

                    if (resultado.data && resultado.data.session) {
                        return resultado.data.session;
                    }
                } catch (erro) {
                    console.warn("Aguardando a sessão do RunWorld:", erro);
                }

                await esperar(350);
            }

            return null;
        }

        async function abrirAplicativo() {
            if (redirecionando) return;
            redirecionando = true;

            estado.textContent = "Verificando sua conta...";
            detalhe.textContent = "Só mais um instante.";

            const sessao = await obterSessao();
            const tempoDecorrido = Date.now() - inicio;
            const esperaRestante = Math.max(0, TEMPO_MINIMO - tempoDecorrido);

            if (esperaRestante > 0) {
                await esperar(esperaRestante);
            }

            if (sessao) {
                window.location.replace("./index.html");
                return;
            }

            // Se a página foi aberta após o retorno do Google,
            // não enviar imediatamente para início antes de dar
            // tempo ao SDK para recuperar a sessão.
            const parametros = new URLSearchParams(window.location.search);
            const hash = new URLSearchParams(
                window.location.hash.replace(/^#/, "")
            );

            const retornoOAuth =
                parametros.has("code") ||
                hash.has("access_token") ||
                hash.has("error") ||
                hash.has("error_description");

            if (retornoOAuth) {
                estado.textContent = "Não foi possível confirmar a entrada.";
                detalhe.textContent =
                    "Volte ao login e tente novamente. Confira a configuração OAuth no Supabase.";

                redirecionando = false;
                return;
            }

            window.location.replace("./inicio.html");
        }

        // A animação não depende de o vídeo conseguir tocar.
        // Se o vídeo falhar, o logo e o indicador continuam visíveis.
        if (video) {
            video.play().catch(() => {
                console.info("Vídeo indisponível; mantendo a tela de entrada.");
            });
        }

        // Espera a página carregar e então valida a sessão.
        window.addEventListener("load", () => {
            abrirAplicativo();
        }, { once: true });

        // Proteção caso o evento load já tenha ocorrido.
        if (document.readyState === "complete") {
            abrirAplicativo();
        }

        // Evita ficar preso indefinidamente se a conexão falhar.
        setTimeout(() => {
            if (!redirecionando) abrirAplicativo();
        }, TEMPO_MAXIMO);
    })();
    </script>
</body>
</html>
